# Kylin Ops Agent 配置文件（比赛环境适配版）
# 修改后无需重启，配置会在下次请求时自动加载

# Agent 基础配置
agent:
  name: "KylinSafeOpsAgent"
  version: "1.0.0"
  description: "面向麒麟操作系统的安全智能运维Agent"
  
# LLM 配置
# 比赛环境说明：
# - 如果提供了 LLM API，请修改 api_base 和 api_key
# - 如果没有 LLM，保持默认即可，系统会自动回退到 Mock 模式
# - Mock 模式已内置支持所有运维测试用例（ps/df/free/内存/CPU/网络/进程/日志等）
llm:
  provider: "openai_compatible"
  api_base: "http://localhost:8000/v1"
  api_key: "sk-dummy"
  model: "deepseek-chat"
  temperature: 0.3
  max_tokens: 4096
  timeout: 60

# MCP Server 配置
mcp:
  server_name: "kylin-ops-mcp-server"
  version: "1.0.0"
  
# 安全护栏配置
security:
  # 危险命令黑名单（正则）
  dangerous_commands:
    - "^\\s*rm\\s+-rf\\s+/"
    - "^\\s*mkfs\\."
    - "^\\s*dd\\s+if=.*of=/dev/[sh]d[a-z]"
    - "^\\s*>\\s*/dev/[sh]d[a-z]"
    - "^\\s*chmod\\s+-R\\s+777\\s+/"
    - ":(){ :|:& };:"
    - "^\\s*reboot"
    - "^\\s*shutdown"
  
  # 需要确认的高危操作
  confirm_required_patterns:
    - "rm\\s+.*-rf"
    - "kill\\s+-9"
    - "chmod\\s+.*777"
    - "systemctl\\s+(stop|restart)"
  
  # 最小权限执行用户
  # 说明：
  # - 若该用户存在，命令将以此用户身份运行
  # - 若不存在，自动降级为当前用户执行（比赛环境常见情况）
  restricted_user: "opsagent"
  
  # 允许执行的命令白名单前缀
  allowed_command_prefixes:
    - "ps"
    - "top"
    - "htop"
    - "df"
    - "du"
    - "free"
    - "lsof"
    - "netstat"
    - "ss"
    - "ip"
    - "ping"
    - "journalctl"
    - "systemctl status"
    - "cat"
    - "grep"
    - "find"
    - "ls"
    - "pwd"
    - "uname"
    - "uptime"
    - "who"
    - "last"
    - "vmstat"
    - "iostat"
    - "mpstat"
    - "sar"
    - "dmesg"
    - "lsblk"
    - "fdisk -l"
    - "tar"
    - "gzip"
    - "tail"
    - "head"
    - "wc"
    - "getenforce"
    - "sestatus"
    - "crontab"
    - "getent"
    - "useradd"
    - "kill"

# 审计配置
audit:
  log_dir: "./logs/audit"
  log_level: "INFO"
  retention_days: 90
  enable_console: true

# 认证配置
auth:
  session_ttl: 28800  # 8小时，单位秒
  enable_dev_token: false  # 比赛环境禁用开发Token，确保安全
  cookie_secure: false     # HTTP环境设为false，HTTPS环境设为true
