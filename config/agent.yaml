# Kylin Ops Agent 配置文件（比赛环境适配版）
# 修改后无需重启，配置会在下次请求时自动加载

# Agent 基础配置
agent:
  name: "KylinSafeOpsAgent"
  version: "1.0.0"
  description: "面向麒麟操作系统的安全智能运维Agent"
  
# LLM 配置
# 比赛环境说明：
# - 如果提供了 LLM API，请修改 api_base 和 api_key
# - 如果没有 LLM，保持默认即可，系统会自动回退到 Mock 模式
# - Mock 模式已内置支持所有运维测试用例（ps/df/free/内存/CPU/网络/进程/日志等）
llm:
  provider: "openai_compatible"
  api_base: "http://localhost:8000/v1"
  api_key: "sk-dummy"
  model: "deepseek-chat"
  temperature: 0.3
  max_tokens: 4096
  timeout: 60

# MCP Server 配置
mcp:
  server_name: "kylin-ops-mcp-server"
  version: "1.0.0"
  
# 安全护栏配置
security:
  # 危险命令黑名单（正则）
  dangerous_commands:
    - "^\\s*rm\\s+-rf\\s+/"
    - "^\\s*mkfs\\."
    - "^\\s*dd\\s+if=.*of=/dev/[sh]d[a-z]"
    - "^\\s*>\\s*/dev/[sh]d[a-z]"
    - "^\\s*chmod\\s+-R\\s+777\\s+/"
    - ":(){ :|:& };:"
    - "^\\s*reboot"
    - "^\\s*shutdown"
  
  # 需要确认的高危操作
  confirm_required_patterns:
    - "rm\\s+.*-rf"
    - "kill\\s+-9"
    - "chmod\\s+.*777"
    - "systemctl\\s+(stop|restart)"
  
  # 最小权限执行用户
  # 说明：
  # - 若该用户存在，命令将以此用户身份运行
  # - 若不存在，自动降级为当前用户执行（比赛环境常见情况）
  restricted_user: "opsagent"
  
  # 允许执行的命令白名单前缀
  allowed_command_prefixes:
    - "ps"
    - "top"
    - "htop"
    - "df"
    - "du"
    - "free"
    - "lsof"
    - "netstat"
    - "ss"
    - "ip"
    - "ping"
    - "journalctl"
    - "systemctl status"
    - "cat"
    - "grep"
    - "find"
    - "ls"
    - "pwd"
    - "uname"
    - "uptime"
    - "who"
    - "last"
    - "vmstat"
    - "iostat"
    - "mpstat"
    - "sar"
    - "dmesg"
    - "lsblk"
    - "fdisk -l"
    - "tar"
    - "gzip"
    - "tail"
    - "head"
    - "wc"
    - "getenforce"
    - "sestatus"
    - "crontab"
    - "getent"
    # 注意：useradd、kill 等涉及账户/进程变更的命令已从白名单移除，
    # 避免在受限用户上下文被滥用；必要时应通过专用 MCP 工具并走审批流程。

# 审计配置
audit:
  log_dir: "./logs/audit"
  log_level: "INFO"
  retention_days: 90
  enable_console: true

# 认证配置
auth:
  session_ttl: 86400  # 24小时，单位秒（生产环境建议更短）
  enable_dev_token: false  # 比赛环境禁用开发Token，确保安全
  cookie_secure: false     # HTTP环境设为false，HTTPS环境设为true

# 邮件服务配置（SMTP）
# 常用 SMTP 服务器：
#   QQ邮箱: smtp.qq.com, 端口587, 需开启SMTP服务获取授权码
#   163邮箱: smtp.163.com, 端口465
#   Gmail: smtp.gmail.com, 端口587
email:
  smtp_host: "smtp.qq.com"
  smtp_port: 465
  smtp_user: "1364387139@qq.com"
  smtp_password: ""  # 请通过环境变量 SMTP_PASSWORD 设置
  sender_name: "Kylin Ops Agent"

# 短信服务配置
# 支持三种后端：aliyun / twilio / custom
sms:
  provider: "log"          # log=仅打印日志, aliyun=阿里云, twilio=Twilio, custom=自定义Webhook
  # --- 阿里云短信 ---
  aliyun_access_key: ""
  aliyun_secret: ""
  aliyun_sign_name: "Kylin Ops"
  aliyun_template_code: ""
  # --- Twilio ---
  twilio_account_sid: ""
  twilio_auth_token: ""
  twilio_from_number: ""
  # --- 自定义 Webhook ---
  custom_url: ""
  custom_token: ""
