<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Kylin Safe Ops Agent</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        .login-box {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
        }
        .login-box h2 {
            text-align: center;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        .login-box .subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 32px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        .form-group input:focus {
            border-color: var(--primary);
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .login-btn:hover {
            background: var(--primary-hover);
        }
        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .login-error {
            margin-top: 16px;
            padding: 12px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: var(--radius);
            color: var(--danger);
            font-size: 14px;
            display: none;
        }
        .login-error.active {
            display: block;
        }
        .login-switch {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .login-switch a {
            color: var(--primary);
            text-decoration: none;
        }
        .login-switch a:hover {
            text-decoration: underline;
        }
        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2>🛡️ KylinOps</h2>
            <p class="subtitle">安全智能运维 Agent</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginUsername">用户名</label>
                    <input type="text" id="loginUsername" placeholder="请输入用户名" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="loginPassword">密码</label>
                    <input type="password" id="loginPassword" placeholder="请输入密码" required autocomplete="current-password">
                </div>
                <button type="submit" class="login-btn" id="loginBtn">登 录</button>
                <div class="login-error" id="loginError"></div>
                <div class="login-switch">
                    还没有账号？<a href="#" id="toRegister">立即注册</a>
                </div>
            </form>

            <form id="registerForm" style="display: none;">
                <div class="form-group">
                    <label for="regUsername">用户名</label>
                    <input type="text" id="regUsername" placeholder="请输入用户名（3-32位）" required autocomplete="username" minlength="3" maxlength="32">
                </div>
                <div class="form-group">
                    <label for="regPassword">密码</label>
                    <input type="password" id="regPassword" placeholder="请输入密码（至少6位）" required autocomplete="new-password" minlength="6">
                </div>
                <div class="form-group">
                    <label for="regPassword2">确认密码</label>
                    <input type="password" id="regPassword2" placeholder="请再次输入密码" required autocomplete="new-password" minlength="6">
                </div>
                <button type="submit" class="login-btn" id="registerBtn">注 册</button>
                <div class="login-error" id="registerError"></div>
                <div class="login-switch">
                    已有账号？<a href="#" id="toLogin">返回登录</a>
                </div>
            </form>
            
            <div class="login-footer">
                <p id="defaultCredsHint" style="display:none;">默认账号: opsadmin / KylinOps@2024</p>
                <p>生产环境请通过环境变量 OPS_ADMIN_USER / OPS_ADMIN_PASS 修改</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin + '/api';

        // 如果已经登录，直接跳转到主界面
        async function checkLoggedIn() {
            try {
                const res = await fetch(API_BASE + '/auth/me', {
                    credentials: 'include'
                });
                if (res.ok) {
                    window.location.href = '/';
                }
            } catch (e) {
                // 忽略错误，留在登录页
            }
        }
        checkLoggedIn();

        // 仅在本地开发环境显示默认凭证提示
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
            const hint = document.getElementById('defaultCredsHint');
            if (hint) hint.style.display = 'block';
        }

        // 切换登录/注册表单
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        document.getElementById('toRegister').addEventListener('click', (e) => {
            e.preventDefault();
            loginForm.style.display = 'none';
            registerForm.style.display = 'block';
            document.getElementById('loginError').classList.remove('active');
        });
        document.getElementById('toLogin').addEventListener('click', (e) => {
            e.preventDefault();
            registerForm.style.display = 'none';
            loginForm.style.display = 'block';
            document.getElementById('registerError').classList.remove('active');
        });

        // 登录处理
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorEl = document.getElementById('loginError');
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            btn.disabled = true;
            btn.textContent = '登录中...';
            errorEl.classList.remove('active');
            errorEl.textContent = '';

            try {
                const res = await fetch(API_BASE + '/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'include',
                    body: JSON.stringify({username, password})
                });
                
                if (res.ok) {
                    window.location.href = '/';
                } else {
                    const data = await res.json();
                    errorEl.textContent = data.detail || '登录失败';
                    errorEl.classList.add('active');
                }
            } catch (e) {
                errorEl.textContent = '网络错误，请检查服务是否正常运行';
                errorEl.classList.add('active');
            } finally {
                btn.disabled = false;
                btn.textContent = '登 录';
            }
        });

        // 注册处理
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('registerBtn');
            const errorEl = document.getElementById('registerError');
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const password2 = document.getElementById('regPassword2').value;

            if (password !== password2) {
                errorEl.textContent = '两次输入的密码不一致';
                errorEl.classList.add('active');
                return;
            }

            btn.disabled = true;
            btn.textContent = '注册中...';
            errorEl.classList.remove('active');
            errorEl.textContent = '';

            try {
                const res = await fetch(API_BASE + '/auth/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });

                if (res.ok) {
                    errorEl.textContent = '注册成功，请登录';
                    errorEl.style.color = '#22c55e';
                    errorEl.classList.add('active');
                    setTimeout(() => {
                        registerForm.style.display = 'none';
                        loginForm.style.display = 'block';
                        errorEl.style.color = '';
                        errorEl.classList.remove('active');
                        document.getElementById('loginUsername').value = username;
                    }, 1500);
                } else {
                    const data = await res.json();
                    errorEl.textContent = data.detail || '注册失败';
                    errorEl.classList.add('active');
                }
            } catch (e) {
                errorEl.textContent = '网络错误，请检查服务是否正常运行';
                errorEl.classList.add('active');
            } finally {
                btn.disabled = false;
                btn.textContent = '注 册';
            }
        });
    </script>
</body>
</html>
